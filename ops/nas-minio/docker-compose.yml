services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: agora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_BIND_ADDR:-100.98.67.189}:9000:9000"
      - "${MINIO_BIND_ADDR:-100.98.67.189}:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    name: agora-blob-data
